<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR & PDF Text Extractor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .form-container {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .upload-area {
            border: 3px dashed #d0d0d0;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #e8eeff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #666;
            font-size: 1rem;
        }

        .file-name {
            margin-top: 15px;
            color: #667eea;
            font-weight: 600;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn.loading {
            position: relative;
            color: transparent;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-container {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid #e9ecef;
            display: none;
        }

        .result-container.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-header h3 {
            color: #333;
            font-size: 1.2rem;
        }

        .copy-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        .result-text {
            background: white;
            padding: 20px;
            border-radius: 8px;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            color: #333;
            line-height: 1.6;
            border: 1px solid #dee2e6;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
        }

        .alert-success {
            background: #efe;
            border: 2px solid #cfc;
            color: #3c3;
        }

        @media (max-width: 768px) {
            .row {
                grid-template-columns: 1fr;
            }

            .form-container {
                padding: 25px;
            }

            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
    <script th:replace="anhmedia :: gtag01"></script>
	<script th:replace="anhmedia :: gtag02"></script>
    
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 OCR & PDF Text Extractor</h1>
            <p>Extract text from images and PDF files with multi-language support</p>
        </div>

        <div class="form-container">
            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <div class="row">
                <div class="form-group">
                    <label for="userId">User ID</label>
                    <input type="text" id="userId" value="anhmedia" required>
                </div>
                <div class="form-group">
                    <label for="tokenId">Token ID</label>
                    <input type="text" id="tokenId" value="abc123" required>
                </div>
            </div>

            <div class="form-group">
                <label for="language">Language</label>
                <select id="language">
                    <option value="vie" selected>Vietnamese (Tiếng Việt)</option>
                    <option value="eng">English</option>
                    <option value="chi_sim">Chinese (中文)</option>
                    <option value="jpn">Japanese (日本語)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Upload File (Image or PDF)</label>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">Click to upload or drag & drop</div>
                    <div class="upload-text" style="font-size: 0.85rem; margin-top: 5px; color: #999;">
                        Supported: JPG, PNG, GIF, BMP, PDF
                    </div>
                    <div class="file-name" id="fileName"></div>
                </div>
                <input type="file" id="fileInput" accept="image/*,.pdf">
            </div>

            <button class="btn" id="submitBtn" onclick="extractText()">
                Extract Text
            </button>

            <div class="result-container" id="resultContainer">
                <div class="result-header">
                    <h3>Extracted Text:</h3>
                    <button class="copy-btn" onclick="copyToClipboard()">Copy Text</button>
                </div>
                <div class="result-text" id="resultText"></div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultText = document.getElementById('resultText');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');

        let selectedFile = null;

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // File input change
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;

            const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/bmp', 'application/pdf'];
            
            if (!validTypes.includes(file.type)) {
                showAlert('Please select a valid image or PDF file', 'error');
                return;
            }

            selectedFile = file;
            fileName.textContent = `📎 ${file.name}`;
            hideAlert();
        }

        async function extractText() {
            if (!selectedFile) {
                showAlert('Please select a file first', 'error');
                return;
            }

            const userId = document.getElementById('userId').value;
            const tokenId = document.getElementById('tokenId').value;
            const language = document.getElementById('language').value;

            if (!userId || !tokenId) {
                showAlert('Please enter User ID and Token ID', 'error');
                return;
            }

            // Show loading state
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            hideAlert();
            resultContainer.classList.remove('show');

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('userId', userId);
            formData.append('tokenId', tokenId);
            formData.append('language', language);

            try {
                const response = await fetch('/api/extract-text', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    resultText.textContent = data.text || 'No text found in the document';
                    resultContainer.classList.add('show');
                    showAlert('Text extracted successfully!', 'success');
                } else {
                    showAlert(data.error || 'Failed to extract text', 'error');
                }

            } catch (error) {
                showAlert('Connection error. Please make sure the server is running on http://localhost:8080', 'error');
                console.error('Error:', error);
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        }

        function copyToClipboard() {
            const text = resultText.textContent;
            navigator.clipboard.writeText(text).then(() => {
                showAlert('Text copied to clipboard!', 'success');
            }).catch(() => {
                showAlert('Failed to copy text', 'error');
            });
        }

        function showAlert(message, type) {
            hideAlert();
            const alert = type === 'error' ? errorAlert : successAlert;
            alert.textContent = message;
            alert.classList.add('show');

            if (type === 'success') {
                setTimeout(hideAlert, 3000);
            }
        }

        function hideAlert() {
            errorAlert.classList.remove('show');
            successAlert.classList.remove('show');
        }
    </script>
</body>
</html>
