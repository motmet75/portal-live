<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Performance Dashboard</title>
    
    <!-- Local ApexCharts CSS -->
    <link rel="stylesheet" th:href="@{/anhmedia.vn/css/apexcharts.css}">
    
    <!-- Local ApexCharts Wrapper Styles -->
    <link rel="stylesheet" th:href="@{/anhmedia.vn/css/apexcharts-wrapper-styles.css}">
    
    <style>
        :root {
            --apex-charts-primary-color: #667eea;
            --apex-charts-background-color: #ffffff;
            --lumo-primary-color: #667eea;
            --lumo-base-color: #ffffff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .page-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .page-header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .page-header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .page-header p {
            color: #6b7280;
            font-size: 1.1em;
        }
        
        .upload-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .upload-card h2 {
            color: #1f2937;
            margin-bottom: 24px;
            font-size: 1.5em;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 0;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }
        
        .form-input,
        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-input[type="file"] {
            padding: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .alert {
            padding: 16px 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 2px solid #fecaca;
        }
        
        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 2px solid #bbf7d0;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }
        
        .spinner {
            border: 4px solid #e5e7eb;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Chart Container */
        .chart-container {
            display: none;
            margin-top: 20px;
        }
        
        .chart-wrapper {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .chart-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .chart-title {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin: 0 0 8px 0;
        }
        
        .chart-subtitle {
            font-size: 14px;
            color: #6b7280;
            margin: 0;
        }
        
        .chart-body {
            position: relative;
            min-height: 400px;
        }
        
        .chart-footer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        
        .chart-stat {
            text-align: center;
            padding: 16px;
            background: #f9fafb;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        
        .chart-stat:hover {
            background: #f3f4f6;
            transform: translateY(-2px);
        }
        
        .chart-stat__value {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 4px;
        }
        
        .chart-stat__label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
	<script th:replace="anhmedia :: gtag01"></script>
<script th:replace="anhmedia :: gtag02"></script>
</head>
<body>
    <div class="page-container">
        <!-- Page Header -->
        <div class="page-header">
            <h1>📊 KPI Performance Dashboard</h1>
            <p>Upload Excel file to visualize Delivery & HR KPIs with interactive charts</p>
        </div>
        
        <!-- Upload Form -->
        <div class="upload-card">
            <h2>Upload KPI Data</h2>
            <form id="uploadForm" th:action="@{/api/kpi/upload}" method="post" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="userId">User ID</label>
                        <input type="text" id="userId" name="userId" class="form-input" 
                               th:value="${userId}" placeholder="Enter user ID" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="token">Access Token</label>
                        <input type="text" id="token" name="token" class="form-input" 
                               th:value="${token}" placeholder="Enter access token" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="chartType">Chart Type</label>
                        <select id="chartType" name="chartType" class="form-select" required>
                            <option value="">Select chart type</option>
                            <option value="bar" th:selected="${chartType == 'bar'}">Bar Chart</option>
                            <option value="line" th:selected="${chartType == 'line'}">Line Chart</option>
                            <option value="area" th:selected="${chartType == 'area'}">Area Chart</option>
                            <option value="pie" th:selected="${chartType == 'pie'}">Pie Chart</option>
                            <option value="donut" th:selected="${chartType == 'donut'}">Donut Chart</option>
                            <option value="radar" th:selected="${chartType == 'radar'}">Radar Chart</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="kpiType">KPI Type</label>
                        <select id="kpiType" name="kpiType" class="form-select" required>
                            <option value="">Select KPI type</option>
                            <option value="delivery" th:selected="${kpiType == 'delivery'}">Delivery KPI</option>
                            <option value="hr" th:selected="${kpiType == 'hr'}">HR KPI</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="excelFile">Excel File</label>
                    <input type="file" id="excelFile" name="file" class="form-input" 
                           accept=".xlsx,.xls" required>
                </div>
                
                <button type="submit" class="btn-primary" id="submitBtn">
                    Upload & Generate Chart
                </button>
            </form>
            
            <div id="errorAlert" class="alert alert-error"></div>
            <div id="successAlert" class="alert alert-success"></div>
        </div>
        
        <!-- Chart Container -->
        <div class="chart" id="chart">
            
        </div>
    </div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p style="color: #374151; font-weight: 600;">Processing your data...</p>
        </div>
    </div>
    
    <!-- Load ApexCharts from local JS folder -->
    <script th:src="@{/anhmedia.vn/js/apexcharts.min.js}"></script>
    
    <!-- Main Application Script -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        // Global chart instance
        let chartInstance = null;
        
        // Get form elements
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const chartContainer = document.getElementById('chartContainer');
        const apexChart = document.getElementById('apexChart');
        const chartTitle = document.getElementById('chartTitle');
        const chartSubtitle = document.getElementById('chartSubtitle');
        const chartStats = document.getElementById('chartStats');
        
        // Hide alerts
        function hideAlerts() {
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';
        }
        
        // Show error
        function showError(message) {
            hideAlerts();
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
            errorAlert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        // Show success
        function showSuccess(message) {
            hideAlerts();
            successAlert.textContent = message;
            successAlert.style.display = 'block';
        }
        
        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('userId', document.getElementById('userId').value);
            formData.append('token', document.getElementById('token').value);
            formData.append('chartType', document.getElementById('chartType').value);
            formData.append('kpiType', document.getElementById('kpiType').value);
            formData.append('file', document.getElementById('excelFile').files[0]);
            
              
               
                fetch('/api/kpi/upload', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include' // Include cookies for authentication
                })
                .then(res => res.json())
                .then(data => {
                  const options = {
                    chart: {
                      type: data.chartType || 'bar',
                      height: 420,
                      toolbar: { show: true }
                    },
                    series: data.series ?? [],
                    colors: data.colors && data.colors.length ? data.colors : undefined,
                    plotOptions: {
                      bar: {
                        horizontal: false,
                        columnWidth: '55%',
                        borderRadius: 6
                      }
                    },
                    dataLabels: {
                      enabled: true,
                      formatter: function(val) { return val + "%"; } // show percent
                    },
                    stroke: {
                      show: true,
                      width: 1,
                      colors: ['#fff']
                    },
                    xaxis: {
                      categories: data.categories ?? [],
                      title: {
                        text: 'Month'
                      }
                    },
                    yaxis: {
                      max: 100,
                      min: 0,
                      tickAmount: 5,
                      labels: {
                        formatter: function(val) { return val + "%"; }
                      },
                      title: {
                        text: 'Completion (%)'
                      }
                    },
                    tooltip: {
                      y: {
                        formatter: function(val) { return val + "%"; }
                      }
                    },
                    legend: {
                      position: 'top'
                    },
                    responsive: [{
                      breakpoint: 640,
                      options: {
                        plotOptions: {
                          bar: {
                            columnWidth: '70%'
                          }
                        }
                      }
                    }]
                  };

                  const chart = new ApexCharts(document.querySelector("#chart"), options);
                  chart.render();
                })
                .catch(err => {
                  console.error('Failed to load KPI chart', err);
                  document.querySelector('#chart').innerHTML = '<p>Unable to load chart</p>';
                });
        });
        
        // Render chart using ApexCharts directly
        function renderChart(data) {

             // Map the ApexChartsBuilder JSON to ApexCharts options
             const options = {
                 chart: data.chart,
                 series: data.series,
                 xaxis: data.xaxis,
                 // include other config properties if needed
             };
             const chart = new ApexCharts(document.querySelector("#chartContainer"), options);
             chart.render();
             
        }
        
        // Build chart options based on data
        function buildChartOptions(data) {
            const baseOptions = {
                series: data.series || [],
                chart: {
                    type: data.chartType || 'bar',
                    height: 450,
                    fontFamily: 'Inter, system-ui, -apple-system, sans-serif',
                    toolbar: {
                        show: true,
                        tools: {
                            download: true,
                            selection: true,
                            zoom: true,
                            zoomin: true,
                            zoomout: true,
                            pan: true,
                            reset: true
                        }
                    },
                    animations: {
                        enabled: true,
                        speed: 800,
                        animateGradually: {
                            enabled: true,
                            delay: 150
                        }
                    }
                },
                colors: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b', '#fa709a'],
                dataLabels: {
                    enabled: true,
                    style: {
                        fontSize: '12px',
                        fontWeight: 600
                    }
                },
                stroke: {
                    curve: 'smooth',
                    width: data.chartType === 'line' || data.chartType === 'area' ? 3 : 1
                },
                title: {
                    text: data.title || 'KPI Performance',
                    align: 'center',
                    style: {
                        fontSize: '20px',
                        fontWeight: 700,
                        color: '#1f2937'
                    }
                },
                grid: {
                    borderColor: '#e5e7eb',
                    strokeDashArray: 4
                },
                legend: {
                    position: 'bottom',
                    horizontalAlign: 'center',
                    fontSize: '13px',
                    fontWeight: 500
                },
                tooltip: {
                    theme: 'light',
                    y: {
                        formatter: function(val) {
                            return val.toLocaleString() + (data.unit || '');
                        }
                    }
                }
            };
            
            // Chart type specific options
            if (data.chartType === 'bar') {
                baseOptions.plotOptions = {
                    bar: {
                        horizontal: false,
                        columnWidth: '60%',
                        borderRadius: 8
                    }
                };
                baseOptions.xaxis = {
                    categories: data.categories || [],
                    labels: {
                        style: {
                            fontSize: '12px',
                            fontWeight: 500
                        }
                    }
                };
                baseOptions.yaxis = {
                    title: {
                        text: data.yAxisTitle || 'Value'
                    },
                    labels: {
                        formatter: function(val) {
                            return val.toFixed(0);
                        }
                    }
                };
            }
            
            if (data.chartType === 'line' || data.chartType === 'area') {
                baseOptions.xaxis = {
                    categories: data.categories || [],
                    labels: {
                        style: {
                            fontSize: '12px'
                        }
                    }
                };
                baseOptions.yaxis = {
                    labels: {
                        formatter: function(val) {
                            return val.toFixed(0);
                        }
                    }
                };
                baseOptions.markers = {
                    size: 5,
                    hover: {
                        size: 7
                    }
                };
                
                if (data.chartType === 'area') {
                    baseOptions.fill = {
                        type: 'gradient',
                        gradient: {
                            shadeIntensity: 1,
                            opacityFrom: 0.6,
                            opacityTo: 0.1,
                            stops: [0, 90, 100]
                        }
                    };
                }
            }
            
            if (data.chartType === 'pie' || data.chartType === 'donut') {
                baseOptions.labels = data.categories || [];
                baseOptions.plotOptions = {
                    pie: {
                        donut: data.chartType === 'donut' ? {
                            size: '65%',
                            labels: {
                                show: true,
                                name: {
                                    fontSize: '16px',
                                    fontWeight: 600
                                },
                                value: {
                                    fontSize: '24px',
                                    fontWeight: 700,
                                    formatter: function(val) {
                                        return parseFloat(val).toLocaleString();
                                    }
                                },
                                total: {
                                    show: true,
                                    label: 'Total',
                                    fontSize: '14px',
                                    fontWeight: 600,
                                    formatter: function(w) {
                                        return w.globals.seriesTotals.reduce((a, b) => a + b, 0).toLocaleString();
                                    }
                                }
                            }
                        } : undefined
                    }
                };
            }
            
            if (data.chartType === 'radar') {
                baseOptions.xaxis = {
                    categories: data.categories || []
                };
                baseOptions.yaxis = {
                    show: false
                };
            }
            
            return baseOptions;
        }
        
        // Render statistics
        function renderStats(data) {
            const series = data.series || [];
            if (series.length === 0) {
                chartStats.innerHTML = '';
                return;
            }
            
            let statsHtml = '';
            
            // Calculate totals for each series
            series.forEach(serie => {
                if (serie.data && Array.isArray(serie.data)) {
                    const total = serie.data.reduce((sum, val) => sum + (val || 0), 0);
                    const avg = total / serie.data.length;
                    const max = Math.max(...serie.data);
                    
                    statsHtml += `
                        <div class="chart-stat">
                            <div class="chart-stat__value">${total.toFixed(0)}</div>
                            <div class="chart-stat__label">${serie.name} Total</div>
                        </div>
                        <div class="chart-stat">
                            <div class="chart-stat__value">${avg.toFixed(1)}</div>
                            <div class="chart-stat__label">${serie.name} Avg</div>
                        </div>
                        <div class="chart-stat">
                            <div class="chart-stat__value">${max.toFixed(0)}</div>
                            <div class="chart-stat__label">${serie.name} Max</div>
                        </div>
                    `;
                }
            });
            
            chartStats.innerHTML = statsHtml;
        }
        
        // Check if we have chart data from server (Thymeleaf)
        /*[# th:if="${chartData != null}"]*/
        window.addEventListener('DOMContentLoaded', () => {
            const serverData = /*[[${chartData}]]*/ null;
            if (serverData) {
                renderChart(serverData);
            }
        });
        /*[/]*/
        /*]]>*/
    </script>
</body>
</html>
