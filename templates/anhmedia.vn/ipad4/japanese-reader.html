<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Kotoba Lite iPad 4</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#f3f4f1;color:#202826;font-family:Arial,sans-serif;font-size:14px}
    button,input,textarea{font:inherit}
    button{-webkit-appearance:none;cursor:pointer}
    #app{max-width:980px;margin:auto;background:#fff;min-height:100vh}
    .top{padding:8px;background:#263b36;color:#fff}
    .top b{font-size:18px}
    .top .actions{float:right}
    .top button{min-height:36px;margin-left:5px;padding:7px 10px;border:1px solid #ccd7d2;border-radius:5px;background:#fff;color:#263b36;font-weight:bold}
    .clear{clear:both}
    .tabs{padding:7px;border-bottom:1px solid #ddd}
    .tabs button{padding:8px 10px;margin-right:4px;border:1px solid #ccd7d2;border-radius:5px;background:#fff;font-weight:bold}
    .tabs .active{background:#315f55;color:#fff}
    .panel{padding:10px}
    .hidden{display:none!important}
    .notice,.status{padding:8px;margin-bottom:8px;border:1px solid #ddd7b8;border-radius:5px;background:#fff8dc;font-size:12px}
    .search,.title{width:100%;padding:8px;margin-bottom:7px;border:1px solid #ccd7d2;border-radius:5px}
    .nav{text-align:center;padding:7px;margin:7px 0;border:1px solid #d7dfdc;border-radius:5px;background:#f8faf8}
    .nav button,.nav input{height:34px;margin:2px;border:1px solid #ccd7d2;border-radius:5px;background:#fff;color:#315f55;font-weight:bold}
    .nav button{padding:5px 8px}.nav input{width:50px;text-align:center}
    #editor{width:100%;min-height:330px;padding:12px;border:1px solid #cfd9d5;border-radius:6px;background:#fffefa;font:18px/1.8 Georgia,"Hiragino Mincho ProN",serif;resize:vertical}
    .row{margin:7px 0}.row button{padding:8px 10px;margin:2px;border:1px solid #ccd7d2;border-radius:5px;background:#fff;font-weight:bold}.row .primary{background:#315f55;color:#fff}
    #result{padding:10px;margin-top:8px;border:1px solid #ccd7d2;border-radius:6px}
    .block{padding:8px;margin:6px 0;border:1px solid #e1e5e2;border-radius:5px;background:#f8faf8}
    .word{display:inline-block;vertical-align:top;width:205px;margin:4px;padding:8px;border:1px solid #d9e0dd;border-radius:5px;background:#fff}
    .word .jp{font-size:21px}.word .read{color:#9a5548}.word .romaji,.small{font-size:11px;color:#66736f}.word button{margin-top:5px;padding:5px 7px}
    .item{padding:8px;margin:6px 0;border:1px solid #d8e0dd;border-radius:5px;background:#fff}
    .item button{padding:6px 8px;margin:3px;border:1px solid #ccd7d2;border-radius:5px;background:#fff}
    .bookmarks{margin:6px 0 0 12px}.bookmark{padding:6px;margin:4px 0;border-left:3px solid #d9c38f;background:#fff8e6}
    .modal{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;display:none;background:rgba(20,28,26,.70)}
    .card{max-width:500px;margin:50px auto;padding:16px;border-radius:7px;background:#fff}
    .card textarea,.card input{width:100%;padding:8px;margin:5px 0;border:1px solid #ccd7d2;border-radius:5px}
    .spinner{width:30px;height:30px;margin:0 auto 8px;border:4px solid #d9e3df;border-top-color:#315f55;border-radius:50%;-webkit-animation:spin .8s linear infinite}
    @-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
    #toast{position:fixed;left:10px;right:10px;bottom:10px;z-index:10000;display:none;padding:9px;background:#263b36;color:#fff;text-align:center}
    @media(max-width:700px){.top .actions{float:none;margin-top:6px}.word{display:block;width:auto}.card{margin:25px 10px}}
    .saved-check{display:inline-block;vertical-align:top;margin:3px 7px 0 0;width:20px;height:20px}
    .saved-item-body{display:inline-block;vertical-align:top;width:calc(100% - 34px)}
    .saved-selected{background:#fff8dc!important;border-color:#d8c17b!important}
  </style>
</head>
<body>
<div id="app">
  <div class="top"><b>言 Kotoba Lite</b><div class="actions">
    <button id="googleBtn">Google</button>
    <button id="analyzeTop" disabled>Phân tích</button>
    <button id="logoutBtn">Thoát</button>
  </div><div class="clear"></div></div>

  <div class="tabs"><button id="tabRead" class="active">Tài liệu</button><button id="tabSaved">Đã lưu</button><button id="tabLib">Thư viện</button></div>

  <div id="readView" class="panel">
    <div class="notice">Giới hạn: <b id="remaining">...</b>/<b id="limit">...</b></div>
    <input id="search" class="search" placeholder="Tìm trong tài liệu">
    <input id="docTitle" class="title" value="Tài liệu mẫu">

    <div class="nav"><button class="prev">←</button><span class="pageLabel">1/1</span><input class="pageJump" type="number" min="1" value="1"><button class="next">→</button><button class="bookmarkBtn">🔖</button></div>

    <textarea id="editor">パイロット燃料は微量だが点火プラグに比し約8000倍という強力な着火エネルギーを有する。</textarea>

    <div class="row">
      <button id="saveDoc">Lưu tài liệu</button>
      <button id="pdfBtn">PDF / URL</button>
      <button id="speakSel">▶ Đọc</button>
      <button id="analyzeBottom" class="primary" disabled>Phân tích đoạn chọn</button>
    </div>

    <div class="nav"><button class="prev">←</button><span class="pageLabel">1/1</span><input class="pageJump" type="number" min="1" value="1"><button class="next">→</button><button class="bookmarkBtn">🔖</button></div>

    <div id="result" class="hidden">
      <div class="block"><b>Đoạn gốc</b><div id="src"></div></div>
      <div class="block"><b>Hiragana</b><div id="hira"></div></div>
      <div class="block"><b>VI</b><div id="vi"></div></div>
      <div class="block"><b>EN</b><div id="en"></div></div>
      <div class="block"><b>Từ vựng</b><div id="words"></div></div>
      <div class="row"><button id="saveAll">Lưu tất cả</button><button id="readAll">▶ Đọc cả câu</button></div>
    </div>
  </div>

  <div id="savedView" class="panel hidden">
    <input id="savedSearch" class="search" placeholder="Tìm từ/câu đã lưu">
    <div class="row">
      <button id="selectAllSaved" type="button">Chọn tất cả</button>
      <button id="clearSavedSelection" type="button">Bỏ chọn</button>
      <button id="deleteSelectedSaved" type="button">Xóa mục đã chọn</button>
      <span id="savedSelectedCount" class="small">0 đã chọn</span>
    </div>
    <div id="savedList"></div>
  </div>
  <div id="libView" class="panel hidden"><div id="docList"></div></div>
</div>

<div id="confirmModal" class="modal"><div class="card"><h3>Xác nhận phân tích</h3><textarea id="confirmText" rows="8"></textarea><div class="small" id="confirmCount"></div><div class="row"><button id="confirmCancel">Hủy</button><button id="confirmStart" class="primary">Xác nhận</button></div></div></div>
<div id="waitModal" class="modal"><div class="card"><div class="spinner"></div><h3>Đang phân tích...</h3><div id="waitText"></div></div></div>
<div id="pdfModal" class="modal"><div class="card"><h3>PDF / URL</h3><input id="ocrUser" placeholder="User ID"><input id="ocrToken" type="password" placeholder="Token OCR"><input id="pdfUrl" placeholder="URL PDF/ảnh công khai"><input id="pdfFile" type="file" accept="application/pdf,image/png,image/jpeg"><div class="row"><button id="pdfClose">Hủy</button><button id="pdfUrlGo">Tải URL</button><button id="pdfFileGo">Tải file</button></div><div id="pdfError" class="small"></div></div></div>
<div id="toast"></div>
<script src="/anhmedia.vn/js/japanese-reader-ipad4-lite-v2.js?v=20260820-1"></script>
</body>
</html>
