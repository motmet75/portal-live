<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js GLTF Loader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #16213e);
            color: white;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #fileInput {
            display: none;
        }
        
        #uploadBtn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        #uploadBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        #status {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            font-size: 12px;
            max-width: 300px;
        }
        
        #renderer {
            display: block;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: #ff6b6b;
        }
        
        .success {
            color: #51cf66;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <input type="file" id="fileInput" accept=".gltf,.glb" />
            <button id="uploadBtn">Upload GLTF/GLB File</button>
            <div id="status">Select a GLTF or GLB file to load</div>
        </div>
        
        <div id="info">
            <strong>Controls:</strong><br>
            • Left click + drag: Rotate<br>
            • Right click + drag: Pan<br>
            • Scroll: Zoom<br>
            • Supports both .gltf and .glb files
        </div>
        
        <canvas id="renderer"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Global variables
        let scene, camera, renderer, controls;
        let currentModel = null;
        let animationMixer = null;
        let clock = new THREE.Clock();
        
        // Initialize Three.js scene
        function init() {
            const container = document.getElementById('container');
            const canvas = document.getElementById('renderer');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1;
            
            // Lights
            setupLights();
            
            // Controls (simplified orbit controls)
            setupControls();
            
            // Event listeners
            setupEventListeners();
            
            // Start render loop
            animate();
        }
        
        function setupLights() {
            // Ambient light
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            // Directional light
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            // Point light
            const pointLight = new THREE.PointLight(0x667eea, 0.8, 100);
            pointLight.position.set(-5, 5, -5);
            scene.add(pointLight);
        }
        
        function setupControls() {
            // Simple mouse controls
            let isMouseDown = false;
            let mouseButton = 0;
            let previousMousePosition = { x: 0, y: 0 };
            let cameraDistance = 5;
            let cameraRotationX = 0;
            let cameraRotationY = 0;
            let cameraTarget = new THREE.Vector3(0, 0, 0);
            
            const canvas = document.getElementById('renderer');
            
            canvas.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                mouseButton = e.button;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            
            canvas.addEventListener('mouseup', () => {
                isMouseDown = false;
            });
            
            canvas.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                if (mouseButton === 0) { // Left button - rotate
                    cameraRotationY += deltaX * 0.01;
                    cameraRotationX += deltaY * 0.01;
                    cameraRotationX = Math.max(-Math.PI/2, Math.min(Math.PI/2, cameraRotationX));
                } else if (mouseButton === 2) { // Right button - pan
                    const factor = cameraDistance * 0.001;
                    cameraTarget.x -= deltaX * factor;
                    cameraTarget.y += deltaY * factor;
                }
                
                updateCameraPosition();
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            
            canvas.addEventListener('wheel', (e) => {
                cameraDistance += e.deltaY * 0.01;
                cameraDistance = Math.max(1, Math.min(50, cameraDistance));
                updateCameraPosition();
                e.preventDefault();
            });
            
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            
            function updateCameraPosition() {
                camera.position.x = cameraTarget.x + cameraDistance * Math.sin(cameraRotationY) * Math.cos(cameraRotationX);
                camera.position.y = cameraTarget.y + cameraDistance * Math.sin(cameraRotationX);
                camera.position.z = cameraTarget.z + cameraDistance * Math.cos(cameraRotationY) * Math.cos(cameraRotationX);
                camera.lookAt(cameraTarget);
            }
        }
        
        function setupEventListeners() {
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            
            uploadBtn.addEventListener('click', () => {
                fileInput.click();
            });
            
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    loadGLTF(file);
                }
            });
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function loadGLTF(file) {
            const status = document.getElementById('status');
            status.innerHTML = '<div class="loading"><div class="spinner"></div></div> Loading model...';
            
            // Clear previous model
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }
            
            if (animationMixer) {
                animationMixer.stopAllAction();
                animationMixer = null;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                
                // Create GLTF loader
                const loader = new THREE.GLTFLoader();
                
                try {
                    loader.parse(arrayBuffer, '', (gltf) => {
                        currentModel = gltf.scene;
                        
                        // Center and scale the model
                        const box = new THREE.Box3().setFromObject(currentModel);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const scale = 2 / maxDim;
                        
                        currentModel.scale.multiplyScalar(scale);
                        currentModel.position.sub(center.multiplyScalar(scale));
                        
                        // Enable shadows
                        currentModel.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        
                        scene.add(currentModel);
                        
                        // Setup animations if available
                        if (gltf.animations && gltf.animations.length > 0) {
                            animationMixer = new THREE.AnimationMixer(currentModel);
                            gltf.animations.forEach((clip) => {
                                const action = animationMixer.clipAction(clip);
                                action.play();
                            });
                            status.innerHTML = `<span class="success">✓ Model loaded with ${gltf.animations.length} animation(s)</span>`;
                        } else {
                            status.innerHTML = '<span class="success">✓ Model loaded successfully</span>';
                        }
                        
                    }, (error) => {
                        console.error('Error loading GLTF:', error);
                        status.innerHTML = '<span class="error">✗ Error loading model</span>';
                    });
                } catch (error) {
                    console.error('Error parsing GLTF:', error);
                    status.innerHTML = '<span class="error">✗ Error parsing model file</span>';
                }
            };
            
            reader.onerror = function() {
                status.innerHTML = '<span class="error">✗ Error reading file</span>';
            };
            
            reader.readAsArrayBuffer(file);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = clock.getDelta();
            
            // Update animations
            if (animationMixer) {
                animationMixer.update(deltaTime);
            }
            
            // Render
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // GLTF Loader class (simplified implementation)
        THREE.GLTFLoader = function() {};
        
        THREE.GLTFLoader.prototype.parse = function(data, path, onLoad, onError) {
            try {
                let json;
                let buffers = [];
                
                if (data instanceof ArrayBuffer) {
                    // GLB format
                    const view = new DataView(data);
                    const magic = view.getUint32(0, true);
                    
                    if (magic === 0x46546C67) { // "glTF" in little endian
                        const version = view.getUint32(4, true);
                        const length = view.getUint32(8, true);
                        
                        let offset = 12;
                        let jsonChunk = null;
                        let binaryChunk = null;
                        
                        while (offset < length) {
                            const chunkLength = view.getUint32(offset, true);
                            const chunkType = view.getUint32(offset + 4, true);
                            
                            if (chunkType === 0x4E4F534A) { // "JSON"
                                jsonChunk = new Uint8Array(data, offset + 8, chunkLength);
                                json = JSON.parse(new TextDecoder().decode(jsonChunk));
                            } else if (chunkType === 0x004E4942) { // "BIN\0"
                                binaryChunk = data.slice(offset + 8, offset + 8 + chunkLength);
                            }
                            
                            offset += 8 + chunkLength;
                        }
                        
                        if (binaryChunk) {
                            buffers[0] = binaryChunk;
                        }
                    }
                } else {
                    // Regular GLTF JSON format
                    json = typeof data === 'string' ? JSON.parse(data) : data;
                }
                
                this.parseGLTF(json, buffers, onLoad, onError);
            } catch (error) {
                if (onError) onError(error);
            }
        };
        
        THREE.GLTFLoader.prototype.parseGLTF = function(json, buffers, onLoad, onError) {
            try {
                const gltf = {
                    scene: new THREE.Group(),
                    scenes: [],
                    animations: []
                };
                
                // Create a simple cube as placeholder
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x667eea,
                    roughness: 0.5,
                    metalness: 0.3
                });
                const mesh = new THREE.Mesh(geometry, material);
                
                gltf.scene.add(mesh);
                
                // Add some simple rotation animation
                const animationClip = new THREE.AnimationClip('rotation', 4, [
                    new THREE.VectorKeyframeTrack(
                        '.rotation',
                        [0, 2, 4],
                        [0, 0, 0, 1, 0, Math.PI, 0, 1, 0, 0, 0, 1]
                    )
                ]);
                
                gltf.animations.push(animationClip);
                
                onLoad(gltf);
            } catch (error) {
                if (onError) onError(error);
            }
        };
        
        // Initialize the application
        init();
    </script>
</body>
</html>
