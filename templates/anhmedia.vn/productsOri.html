<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="anhmedia :: head"> </head>
<body>
	<!-- HEADER -->

		<header th:replace="anhmedia :: topheader"> </header>
	<!-- /HEADER -->

	<div id="breadcrumb" class="section">
		<!-- container -->
		<div class="container">
			<!-- row -->
			<div class="row">
				<div class="col-md-12">
					<ul class="breadcrumb-tree">

					</ul>
				</div>
			</div>
			<!-- /row -->
		</div>
		<!-- /container -->
	</div>
	<!-- /BREADCRUMB -->

	<!-- SECTION -->
	<div class="section">
		<!-- container -->
		<div class="container">
			<!-- row -->
			<div class="row">
				<!-- ASIDE -->
				<div id="aside" class="col-md-3">
					<form id="catalogForm">
						<!-- aside Widget -->
						<div class="aside">
							<h3 class="aside-title">Categories</h3>
							<div class="checkbox-filter">

								<div class="input-checkbox" th:each="catalog : ${catalogs}">
									<input type="checkbox"
										th:id=" 'catalog-' + ${catalog.catalogCode}" th:name="catalog"
										th:value=" ${catalog.catalogCode}"> <label
										th:for=" 'catalog-' + ${catalog.catalogCode}"
										th:utext=" ' <span  >  </span>' + ${catalog.catalogName} + '<small>(120)</small>'">

									</label>
								</div>


							</div>
						</div>
						<!-- /aside Widget -->

						<!-- aside Widget -->
						<div class="aside">
							<h3 class="aside-title">Price</h3>
							<div class="price-filter">
								<div id="price-slider"></div>
								<div class="input-number price-min">
									<input id="price-min" type="number"> <span
										class="qty-up">+</span> <span class="qty-down">-</span>
								</div>
								<span>-</span>
								<div class="input-number price-max">
									<input id="price-max" type="number"> <span
										class="qty-up">+</span> <span class="qty-down">-</span>
								</div>
							</div>
						</div>
						<!-- /aside Widget -->

						<!-- aside Widget -->
						<div class="aside">
							<h3 class="aside-title">Brand</h3>

							<div class="checkbox-filter" th:each="brand : ${brands}">
								<div class="input-checkbox">
									<input type="checkbox" th:id="'brand-' + ${brand.brandCode}"
										th:name="brand" th:value="${brand.brandCode}"> <label
										th:for=" 'brand-' + ${brand.brandCode}"
										th:utext="'<span> </span>' +  ${brand.brandName} + '<small>(578)</small>'">

									</label>


								</div>

							</div>
						</div>

					</form>
					<!-- /aside Widget -->

					<!-- aside Widget -->
					<div class="aside">
						<h3 class="aside-title">Top selling</h3>
						<div class="product-widget" th:each="product : ${products}">
							<div class="product-img">
								<img th:src=" ${product.productImageDesUrl} " alt="">
							</div>
							<div class="product-body">
								<p class="product-category"
									th:text="${product.productCategory.catalogName}">Category</p>
								<h3 class="product-name text-container"
									th:title="${product.productName}">
									<a th:href="'san-pham/' + ${product.path}"
										th:text="${product.productName}">product name goes here</a>
								</h3>
								<h4 class="product-price"
									th:text="${product.productPriceAmount}">
									$980.00
									<del class="product-old-price"></del>
								</h4>
							</div>
						</div>
					</div>
					<!-- /aside Widget -->
				</div>
				<!-- /ASIDE -->


				<!-- STORE -->
				<div id="store" class="col-md-9">
					<!-- store top filter -->
					<div class="store-filter clearfix">
						<div class="store-sort">
							<label> Sort By: <select class="input-select">
									<option value="0">Popular</option>
									<option value="1">Position</option>
							</select>
							</label> <label> Show: <select class="input-select">
									<option value="0">20</option>
									<option value="1">50</option>
							</select>
							</label>
						</div>
						<ul class="store-grid">
							<li class="active"><i class="fa fa-th"></i></li>
							<li><a href="#"><i class="fa fa-th-list"></i></a></li>
						</ul>
					</div>
					<!-- /store top filter -->

					<!-- PAGE CONTENT SECTION -->
					<div class="row">

						<div th:utext="${page.articleContent}"></div>
					</div>
					<!-- /PAGE CONTENT SECTION -->


					<!-- store products -->
					<div class="row" id="productList" th:fragment="productList">
						<!-- product -->
						<div class="col-md-4 col-xs-6" th:each="product : ${products}">
							<div class="product">
								<div class="product-img"> <a th:href="'san-pham/' + ${product.path}">
									<img th:src="  ${product.productImageDesUrl}" alt=""></a>
									<div class="product-label">
										<del class="product-old-price"
											th:text="${product.formatedPriceAmout} + ${product.productPriceCurrency}"
											th:style=" ' display: ' + ${product.formatedPriceAmoutHidden} ">$990.00</del>
										<span class="sale"
											th:text="${product.formatedProductDiscount}"
											th:style=" ' display: ' + ${product.formatedProductDiscountHidden} ">-30%</span>
										<span class="new" th:text="${product.newProductString}"
											th:style=" ' display: ' + ${product.newProductStringHidden} ">NEW</span>

									</div>
								</div>
								<div class="product-body">
									<p class="product-category"
										th:text="${product.productCategory.catalogName}">Category</p>
									<h3 class="product-name text-container"
										th:title="${product.productName}">
										<a th:href="'san-pham/' + ${product.path}"
											th:text="${product.productName}">product name goes here</a>
									</h3>
									<h4 class="product-price"
										th:text="${product.formatedPriceAfterDiscount} + ${product.productPriceCurrency}">$980.00
									</h4>
									<!-- del class="product-old-price" th:text="${product.formatedPriceAmout} + ${product.productPriceCurrency}" th:style=" ' display: ' + ${product.formatedPriceAmoutHidden} ">$990.00</del -->
									<div class="product-rating">
										<i class="fa fa-star"></i> <i class="fa fa-star"></i> <i
											class="fa fa-star"></i> <i class="fa fa-star"></i> <i
											class="fa fa-star"></i>
									</div>
									<div class="product-btns">
										<button class="add-to-wishlist">
											<i class="fa fa-heart-o"></i><span class="tooltipp">add
												to wishlist</span>
										</button>
										<button class="add-to-compare">
											<i class="fa fa-exchange"></i><span class="tooltipp">add
												to compare</span>
										</button>
										<button class="quick-view">
											<i class="fa fa-eye"></i><span class="tooltipp">quick
												view</span>
										</button>
									</div>
								</div>
								<div class="add-to-cart">
									<button class="add-to-cart-btn">
										<i class="fa fa-shopping-cart"></i> add to cart
									</button>
								</div>

							</div>
						</div>
						<!-- /product -->

						<div class="clearfix visible-sm visible-xs"></div>

						<!-- product 
							<div class="col-md-4 col-xs-6">
								<div class="product">
									<div class="product-img">
										<img src="./img/product09.png" alt="">
									</div>
									<div class="product-body">
										<p class="product-category">Category</p>
										<h3 class="product-name"><a href="#">product name goes here</a></h3>
										<h4 class="product-price">$980.00 <del class="product-old-price">$990.00</del></h4>
										<div class="product-rating">
										</div>
										<div class="product-btns">
											<button class="add-to-wishlist"><i class="fa fa-heart-o"></i><span class="tooltipp">add to wishlist</span></button>
											<button class="add-to-compare"><i class="fa fa-exchange"></i><span class="tooltipp">add to compare</span></button>
											<button class="quick-view"><i class="fa fa-eye"></i><span class="tooltipp">quick view</span></button>
										</div>
									</div>
									<div class="add-to-cart">
										<button class="add-to-cart-btn"><i class="fa fa-shopping-cart"></i> add to cart</button>
									</div>
								</div>
							</div>
							 /product -->

						<!-- /store products -->


						<!-- /store bottom filter -->
					</div>
					<!-- /STORE -->
					<!-- store bottom filter -->
					<div class="store-filter clearfix">
						<span class="store-qty">Showing 20-100 products</span>
						<ul class="store-pagination">
							<li class="active">1</li>
							<li><a href="#">2</a></li>
							<li><a href="#">3</a></li>
							<li><a href="#">4</a></li>
							<li><a href="#"><i class="fa fa-angle-right"></i></a></li>
						</ul>
					</div>
				</div>
				<!-- /row -->
			</div>
			<!-- /container -->
		</div>
	</div>
		<!-- /SECTION -->

		<!-- NEWSLETTER -->
		<div th:replace="anhmedia :: footer"> </div>
		<!-- /FOOTER -->

		<!-- jQuery Plugins -->
		<script th:src="'/' + ${domain} + '/js/jquery.min.js'"></script>
		<script th:src="'/' + ${domain} + '/js/bootstrap.min.js'"></script>
		<script th:src="'/' + ${domain} + '/js/slick.min.js'"></script>
		<script th:src="'/' + ${domain} + '/js/nouislider.min.js'"></script>
		<script th:src="'/' + ${domain} + '/js/jquery.zoom.min.js'"></script>
		<script th:src="'/' + ${domain} + '/js/main.js'"></script>
</body>
</html>
