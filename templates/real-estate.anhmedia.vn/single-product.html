<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{real-estate.anhmedia.vn :: head(${product.productName + ' — NEXA Estate'},${product.productShortDes})}"></head><body><header th:replace="~{real-estate.anhmedia.vn :: header('properties')}"></header><main class="detail"><div class="detail-visual detail-360" data-detail-360 data-fallback-panorama="/real-estate.anhmedia.vn/images/tour-360-05.webp"><img class="detail-360__source" th:src="${#strings.replace(product.productImageDesUrl, '_rslt_300x300', '')}" th:alt="${product.productName}" data-detail-source><div class="detail-360__view" data-detail-view role="img" th:attr="aria-label=${'Góc nhìn 360 độ của ' + product.productName}"></div><div class="detail-360__shade"></div><span th:text="${product.productCatalog}">Bất động sản</span><div class="detail-360__badge"><b>360°</b><small>Kéo để nhìn xung quanh</small></div><div class="detail-360__controls" aria-label="Điều khiển ảnh 360 độ"><button type="button" data-detail-look="up" aria-label="Nhìn lên">↑</button><button type="button" data-detail-look="left" aria-label="Xoay trái">←</button><button type="button" data-detail-look="reset" aria-label="Đặt lại góc nhìn">↺</button><button type="button" data-detail-look="right" aria-label="Xoay phải">→</button><button type="button" data-detail-look="down" aria-label="Nhìn xuống">↓</button></div></div><div class="detail-copy"><a href="/products.html">← Danh mục</a><h1 th:text="${product.productName}">Tên dự án</h1><p class="detail-price" th:text="${product.formatedPriceAfterDiscount} + ' ₫'">0 ₫</p><p class="lead" th:text="${product.productShortDes}">Mô tả</p><div class="long-description" th:utext="${product.productLongDes}"></div><a class="cta" href="mailto:demo@anhmedia.vn">Đặt lịch tư vấn <i>↗</i></a></div></main><footer th:replace="~{real-estate.anhmedia.vn :: footer}"></footer></body></html>
