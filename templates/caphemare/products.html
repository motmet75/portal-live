<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{caphemare :: head('Thực đơn — Tiệm Cà Phê Mare', 'Thực đơn cà phê, trà và thức uống tại Tiệm Cà Phê Mare Quận 6.')}"/><body><nav th:replace="~{caphemare :: nav('products')}"></nav><main><header class="menu-hero"><p class="eyebrow">PHA MỚI MỖI NGÀY</p><h1>Thực đơn<br><em>nhà Mare.</em></h1><p>Cà phê đậm vừa, trà thanh mát và những món dễ thương cho bất kỳ lúc nào bạn muốn nghỉ một chút.</p></header><section class="menu-wrap"><div class="menu-intro"><span>TẤT CẢ THỨC UỐNG</span><span>16.000 — 38.000 ₫</span></div><div class="menu-grid"><article class="menu-card" th:each="product,stat : ${products}"><a th:href="'/product/' + ${product.path}"><div class="menu-image"><img th:src="${product.productImageDesUrl}" th:alt="${product.productName}"><span th:text="${#numbers.formatInteger(stat.index + 1, 2)}">01</span></div><div class="menu-copy"><small th:text="${product.productCatalog}">Cà phê</small><h2 th:text="${product.productName}">Tên món</h2><p th:text="${product.productShortDes}">Mô tả món</p><b th:text="${product.formatedPriceAfterDiscount} + ' ₫'">28.000 ₫</b></div></a></article><div class="empty" th:if="${products == null or #lists.isEmpty(products)}">Menu đang được cập nhật — mời bạn ghé trực tiếp tại 60 Đường 23.</div></div></section></main><footer th:replace="~{caphemare :: footer}"></footer></body></html>
