<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, description)">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" th:content="${description}"><title th:text="${title}">SAN Coffee & Tea</title>
<link rel="stylesheet" href="/dailocoffee/css/bootstrap.css"><link rel="stylesheet" href="/dailocoffee/css/style.css"><link rel="stylesheet" href="/dailocoffee/css/dailo.css">
<style>:root{--san:#335c3b;--cream:#fff9ed}.san-nav{background:#17371f!important}.san-nav a{color:#fff!important}.san-nav-tools{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.san-nav-links{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}.san-order{background:var(--san);color:#fff!important;border-radius:24px;padding:10px 22px!important}.san-lang{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}.san-lang-btn{appearance:none;border:1px solid #d8e5dc;background:#fff;color:#17371f;border-radius:999px;display:inline-flex;align-items:center;gap:4px;padding:4px 7px;font-size:12px;font-weight:800;line-height:1;box-shadow:0 2px 8px #00000014}.san-lang-btn span{font-size:16px;line-height:1}.san-lang-btn[aria-pressed="true"]{background:#f6d36a;border-color:#f6d36a;color:#17371f}.san-menu{background:var(--cream);padding:70px 0}.san-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}.san-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px #18351d18;display:flex;flex-direction:column}.san-card img{width:100%;height:180px;object-fit:cover}.san-card-body{padding:18px;display:flex;flex:1;flex-direction:column}.san-card h3{margin:0 0 8px;font-size:21px}.san-category{color:#6f806f;font-size:13px;font-weight:700;margin-bottom:8px}.san-ingredients{color:#596259;font-size:14px;line-height:1.45;margin:0 0 14px}.san-price{color:var(--san);font-weight:700}.san-card-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}.san-card-order{background:var(--san);color:#fff!important;border-radius:22px;padding:8px 15px;font-weight:800;text-decoration:none;white-space:nowrap}.san-error{padding:24px;background:#fff;border-radius:14px}.san-hero{background:linear-gradient(120deg,#132f19dd,#3f7048cc),url('/dailocoffee/images/hero_1.jpeg') center/cover}.san-hero h1,.san-hero h2{color:#fff}@media(max-width:767px){.san-nav-tools{align-items:flex-start}.san-nav-links{justify-content:flex-start}.san-lang{justify-content:flex-start}.san-lang-btn{padding:5px 8px}.san-grid{grid-template-columns:1fr}.san-card img{height:210px}}</style></head>
<body>
<nav th:fragment="nav(active)" class="fh5co-nav san-nav"><div class="container"><div class="row"><div class="col-xs-5"><div id="fh5co-logo"><a href="/home">SAN<span>.</span></a></div></div><div class="col-xs-7 text-right"><div class="san-nav-tools"><div class="san-lang" aria-label="Language"><button type="button" class="san-lang-btn" data-san-lang-code="vi" aria-label="Tiếng Việt"><span>🇻🇳</span>VI</button><button type="button" class="san-lang-btn" data-san-lang-code="en" aria-label="English"><span>🇺🇸</span>EN</button><button type="button" class="san-lang-btn" data-san-lang-code="cn" aria-label="中文"><span>🇨🇳</span>CN</button><button type="button" class="san-lang-btn" data-san-lang-code="tw" aria-label="繁體中文"><span>🇹🇼</span>TW</button><button type="button" class="san-lang-btn" data-san-lang-code="ja" aria-label="日本語"><span>🇯🇵</span>JA</button><button type="button" class="san-lang-btn" data-san-lang-code="ko" aria-label="한국어"><span>🇰🇷</span>KO</button><button type="button" class="san-lang-btn" data-san-lang-code="th" aria-label="ไทย"><span>🇹🇭</span>TH</button><button type="button" class="san-lang-btn" data-san-lang-code="es" aria-label="Español"><span>🇪🇸</span>ES</button><button type="button" class="san-lang-btn" data-san-lang-code="ms" aria-label="Bahasa Melayu"><span>🇲🇾</span>MS</button><button type="button" class="san-lang-btn" data-san-lang-code="id" aria-label="Bahasa Indonesia"><span>🇮🇩</span>ID</button><button type="button" class="san-lang-btn" data-san-lang-code="dv" aria-label="Dhivehi"><span>🇲🇻</span>DV</button></div><div class="san-nav-links"><a data-san-shop-menu href="https://anhmedia.vn/bom-inventory/shop/menu">Thực đơn</a><a class="san-order" data-san-order href="https://anhmedia.vn/bom-inventory/shop/menu">Đặt món</a></div></div></div></div></div></nav>
<footer th:fragment="footer" id="fh5co-footer"><div class="container"><div class="row"><div class="col-md-5"><h3>SAN Coffee & Tea</h3><p>Cà phê, trà trái cây, trà sữa và matcha — menu kết nối trực tiếp từ hệ thống cửa hàng.</p></div><div class="col-md-4"><h4>Địa chỉ</h4><p data-san-address>Đang cập nhật</p></div><div class="col-md-3"><h4>Giờ mở cửa</h4><p data-san-hours>Đang cập nhật</p></div></div><p>© 2026 SAN Coffee & Tea</p></div><script src="/sancoffeetea/js/shop.js"></script></footer>
</body>
</html>
