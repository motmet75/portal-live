<!DOCTYPE html>

<style>:root{--san:#335c3b;--san-dark:#091710;--san-ink:#172015;--san-muted:#5f6d63;--cream:#fff9ed;--paper:#fff}html,body{background:#fff;color:var(--san-ink)}body,.san-place,.san-menu,.san-card,.fh5co-heading,.fh5co-heading h2,.fh5co-heading p{color:var(--san-ink)!important}.san-nav{background:#17371f!important}.san-nav a{color:#fff!important}.san-nav-tools{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.san-nav-links{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}.san-order{background:var(--san);color:#fff!important;border-radius:24px;padding:10px 22px!important}.san-lang{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}.san-lang-btn{appearance:none;border:1px solid #d8e5dc;background:#fff;color:#17371f;border-radius:999px;display:inline-flex;align-items:center;gap:4px;padding:4px 7px;font-size:12px;font-weight:800;line-height:1;box-shadow:0 2px 8px #00000014}.san-lang-btn span{font-size:16px;line-height:1}.san-lang-btn[aria-pressed="true"]{background:#f6d36a;border-color:#f6d36a;color:#17371f}.san-hero{background:linear-gradient(120deg,#132f19e8,#365f3dcc),url('/dailocoffee/images/hero_1.jpeg') center/cover}.san-hero h1,.san-hero h2,.san-hero p,.san-hero a{color:#fff}.san-hero h1{max-width:920px;margin-left:auto;margin-right:auto;font-weight:800;letter-spacing:0}.san-hero-address{max-width:780px;margin:18px auto 0;color:#ffffffd9!important;font-size:20px;line-height:1.5}.san-hero-kicker{display:inline-flex;align-items:center;gap:10px;margin-bottom:18px;color:#dceec6!important;font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.san-hero-kicker:before{content:"";width:8px;height:8px;border-radius:50%;background:#dceec6;box-shadow:0 0 0 7px #dceec622}.san-place{background:#fff;padding:78px 0}.san-place-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(320px,1.1fr);gap:34px;align-items:stretch}.san-place-copy{padding:22px 0}.san-kicker{display:block;margin:0 0 16px;color:#668456;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.san-place h2{margin:0;color:var(--san-ink);font-size:clamp(34px,5vw,62px);font-weight:800;line-height:1.02;letter-spacing:0}.san-place-address{margin:22px 0 0;color:var(--san-ink);font-size:20px;line-height:1.55}.san-place-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.san-place-button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border:1px solid var(--san);border-radius:999px;background:var(--san);color:#fff!important;font-weight:800}.san-place-button.secondary{background:#fff;color:var(--san)!important}.san-place-card{display:grid;grid-template-rows:auto 1fr;overflow:hidden;border:1px solid #e1e8df;background:#f8fbf7;box-shadow:0 22px 60px #18351d18}.san-place-card-head{padding:20px 22px;border-bottom:1px solid #e1e8df}.san-place-card-head strong{display:block;color:var(--san-ink);font-size:19px}.san-place-card-head span{display:block;margin-top:5px;color:var(--san-muted)}.san-map-embed,.san-map-embed iframe{width:100%;min-height:390px}.san-map-embed iframe{display:block;border:0!important}.san-menu{background:var(--cream);padding:70px 0}.san-menu-tools{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:28px 0 24px}.san-search-label{display:grid;gap:7px;min-width:min(100%,360px);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#668456}.san-search-label input{height:48px;border:1px solid #d8e5dc;border-radius:999px;background:#fff;color:var(--san-ink);font-size:16px;font-weight:700;letter-spacing:0;text-transform:none;padding:0 18px;box-shadow:0 10px 30px #18351d10}.san-category-list{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:1}.san-category-filter{appearance:none;border:1px solid #d8e5dc;background:#fff;color:var(--san);border-radius:999px;padding:9px 14px;font-weight:900}.san-category-filter[aria-pressed="true"]{background:var(--san);border-color:var(--san);color:#fff}.san-menu-count{margin:-8px 0 22px;color:var(--san-muted);font-weight:800}.san-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}.san-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px #18351d18;display:flex;flex-direction:column}.san-card img{width:100%;height:180px;object-fit:cover}.san-card-body{padding:18px;display:flex;flex:1;flex-direction:column}.san-card h3{margin:0 0 8px;color:var(--san-ink);font-size:21px}.san-category{color:#6f806f;font-size:13px;font-weight:700;margin-bottom:8px}.san-ingredients{color:#596259;font-size:14px;line-height:1.45;margin:0 0 14px}.san-price{color:var(--san);font-weight:700}.san-card-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}.san-card-order{background:var(--san);color:#fff!important;border-radius:22px;padding:8px 15px;font-weight:800;text-decoration:none;white-space:nowrap}.san-error{padding:24px;background:#fff;border-radius:14px;color:var(--san-ink)!important}.san-footer{background:var(--san-dark)!important;color:#fff!important;padding-top:60px}.san-footer,.san-footer *{color:#fff!important}.san-footer a{text-decoration:none}.san-footer p{color:#fff!important}.san-footer h3,.san-footer h4{color:#fff!important}@media(max-width:767px){.san-nav-tools{align-items:flex-start}.san-nav-links{justify-content:flex-start}.san-lang{justify-content:flex-start}.san-lang-btn{padding:5px 8px}.san-hero h1{font-size:44px}.san-hero-address{font-size:17px}.san-place{padding:58px 0}.san-place-grid{grid-template-columns:1fr}.san-place-card{margin-top:8px}.san-map-embed,.san-map-embed iframe{min-height:320px}.san-menu-tools{display:block}.san-category-list{justify-content:flex-start;margin-top:14px}.san-grid{grid-template-columns:1fr}.san-card img{height:210px}}</style></head>

<footer th:fragment="footer" id="fh5co-footer" class="san-footer"><div class="container"><div class="row"><div class="col-md-5"><h3 th:text="${client != null and client.clientName != null and client.clientName != '' ? client.clientName : 'SAN COFFEE AND TEA - TÊN LỬA'}">SAN COFFEE AND TEA - TÊN LỬA</h3><p th:text="${client != null and client.clientDescription != null and client.clientDescription != '' ? client.clientDescription : 'Cà phê, trà trái cây, trà sữa và matcha - menu kết nối trực tiếp từ hệ thống cửa hàng.'}">Cà phê, trà trái cây, trà sữa và matcha - menu kết nối trực tiếp từ hệ thống cửa hàng.</p></div><div class="col-md-4"><h4>Địa chỉ</h4><p data-san-address th:text="${client != null and client.clientAddress != null and client.clientAddress != '' ? client.clientAddress : '326 Tên Lửa, P. Bình Trị Đông B, Bình Tân, TP. HCM'}">326 Tên Lửa, P. Bình Trị Đông B, Bình Tân, TP. HCM</p></div><div class="col-md-3"><h4>Giờ mở cửa</h4><p data-san-hours>Đang cập nhật</p></div></div><p>© 2026 SAN Coffee & Tea</p></div><script src="/sancoffeetea/js/shop.js"></script></footer>
