<!DOCTYPE html>
<html lang="en" th:lang="${selectedLanguageCode != null ? selectedLanguageCode : 'en'}" xmlns:th="http://www.thymeleaf.org">

<head th:replace="nncminhchau :: head('Minh Châu - Videos Clip')">
</head>

<style>
    .product-search-wrapper {
        position: relative;
        margin: 18px 0 6px;
    }

    .product-search-container {
        display: flex;
        flex-wrap: nowrap;
        align-items: stretch;
        gap: 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        overflow: hidden;
    }

    .product-search-container select.input-select {
        padding: 10px 12px;
        font-size: 0.92rem;
        border: none;
        border-right: 1px solid #ccc;
        outline: none;
        background: #fff;
        cursor: pointer;
        flex-shrink: 0;
    }

    .product-search-container input.search-box {
        flex: 1;
        padding: 10px 14px;
        font-size: 0.92rem;
        border: none;
        outline: none;
        min-width: 0;
    }

    .product-search-container button.search-btn {
        padding: 10px 18px;
        border: none;
        background-color: #007bff;
        color: #fff;
        cursor: pointer;
        font-size: 0.92rem;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background 0.2s;
    }

    .product-search-container button.search-btn:hover {
        background-color: #0056b3;
    }

    .video-page-toolbar {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        margin: 18px 0 10px;
    }

    .video-page-toolbar h1 {
        margin: 0;
        font-size: 1.8rem;
    }
    .pagination-wrapper {
        display: flex;
        justify-content: center;
        padding: 20px 0 10px;
        gap: 6px;
        flex-wrap: wrap;
    }

    .pagination-wrapper button {
        padding: 7px 14px;
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
        color: #333;
        transition: all 0.2s;
    }

    .pagination-wrapper button:hover,
    .pagination-wrapper button.active {
        background: #007bff;
        color: #fff;
        border-color: #007bff;
    }

    @media (max-width: 600px) {
        .product-search-container {
            flex-wrap: wrap;
        }

        .product-search-container select.input-select {
            width: 100%;
            border-right: none;
            border-bottom: 1px solid #ccc;
            border-radius: 4px 4px 0 0;
        }

        .product-search-container input.search-box {
            width: 100%;
            border-bottom: 1px solid #ccc;
        }

        .product-search-container button.search-btn {
            width: 100%;
            border-radius: 0 0 4px 4px;
        }
    }
</style>

<body>

	<header th:replace="nncminhchau :: header"></header>

	<!-- Videos Page Starts Here -->
	<div class="about-page">
		<div class="container">
            <div class="video-page-toolbar">
                <div class="video-social-links">
                    <a href="https://www.youtube.com/@NNCMinhChau" class="video-social-btn youtube-btn"
                       target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-youtube"></i>
                        <span>YouTube</span>
                    </a>
                    <a href="https://www.tiktok.com/@nncminhchau.vn" class="video-social-btn tiktok-btn"
                       target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-tiktok"></i>
                        <span>TikTok</span>
                    </a>
                    <a href="https://www.facebook.com/nncminhchau.vn" class="video-social-btn facebook-btn"
                       target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-facebook-f"></i>
                        <span>Facebook</span>
                    </a>
                </div>
                <h1>Videos Clip</h1>
            </div>

            <div class="product-search-wrapper">
                <form action="/products.html" method="GET" style="margin:0;">
                    <div class="product-search-container">
                        <select id="productCatalogSelect" name="catalog" class="input-select">
                            <option value="0" data-i18n="search.allCategories">Tất cả danh mục</option>
                            <option th:each="catalog : ${catalogs}"
                                    th:value="${catalog.catalogCode}"
                                    th:text="${catalog.catalogName}"
                                    th:selected="${catalog.catalogCode == selectedCatalog}">Danh mục</option>
                        </select>
                        <input type="text"
                               id="productSearchBox"
                               name="keyword"
                               class="search-box"
                               placeholder="Tìm kiếm sản phẩm..." data-i18n-placeholder="search.productPlaceholder"
                               th:value="${keyword != null ? keyword : ''}"
                               autocomplete="off">
                        <button type="submit" class="search-btn">
                            <i class="fa fa-search"></i> <span data-i18n="search.search">Tìm</span>
                        </button>
                    </div>
                </form>
            </div>

			<!-- Top pagination -->
			<div class="pagination-wrapper" th:if="${totalPages != null and totalPages > 1}">
				<form method="get" th:action="@{/videos.html}" style="display:contents;">
					<button type="submit" name="page" th:value="${currentPage - 1}"
							th:if="${currentPage > 1}">&laquo;</button>
					<th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
						<button type="submit" name="page" th:value="${i}"
								th:classappend="${i == currentPage} ? 'active' : ''"
								th:text="${i}">1</button>
					</th:block>
					<button type="submit" name="page" th:value="${currentPage + 1}"
							th:if="${currentPage < totalPages}">&raquo;</button>
				</form>
			</div>

			<div class="video-grid">
				<div class="video-card" th:each="productv : ${productsWithVideos}">
					<div class="video-wrapper">
						<iframe
							th:src="${productv.youtubeVideoURL}"
							frameborder="0"
							allowfullscreen
							allow="fullscreen; picture-in-picture"
							style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
						</iframe>
					</div>
					<div class="video-content">
						<h2 class="video-title" th:text="${productv.productName}">Featured Video</h2>
						<p class="video-description" th:text="${productv.productShortDes}">
							Watch this amazing video content.
						</p>
						<a th:href="'product/' + ${productv.path}" class="read-more-btn">Xem</a>
					</div>
				</div>
			</div>

			<!-- Bottom pagination -->
			<div class="pagination-wrapper" th:if="${totalPages != null and totalPages > 1}">
				<form method="get" th:action="@{/videos.html}" style="display:contents;">
					<button type="submit" name="page" th:value="${currentPage - 1}"
							th:if="${currentPage > 1}">&laquo;</button>
					<th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
						<button type="submit" name="page" th:value="${i}"
								th:classappend="${i == currentPage} ? 'active' : ''"
								th:text="${i}">1</button>
					</th:block>
					<button type="submit" name="page" th:value="${currentPage + 1}"
							th:if="${currentPage < totalPages}">&raquo;</button>
				</form>
			</div>

		</div>
	</div>
	<!-- Videos Page Ends Here -->

	<footer th:replace="nncminhchau :: footer"></footer>

	<div th:replace="nncminhchau :: scripts"></div>
	<script th:src="'/' + ${domain} + '/js/product-search.js'"></script>

</body>
</html>
