<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="nncminhchau :: head('Minh Châu - Tin Tức')">
</head>

<style>
    /* Blog grid layout mirrors the video-grid style */
    .blog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 28px;
        padding: 30px 0;
    }

    .blog-card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .blog-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.13);
    }

    .blog-thumbnail {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
    }

    .blog-content {
        padding: 18px 20px 22px;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .blog-content h2.blog-title {
        font-size: 1.05rem;
        font-weight: 600;
        color: #222;
        margin-bottom: 10px;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .blog-content p.blog-description {
        font-size: 0.88rem;
        color: #666;
        line-height: 1.6;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 14px;
    }

    .blog-meta {
        font-size: 0.78rem;
        color: #999;
        margin-bottom: 12px;
    }

    .blog-meta span + span::before {
        content: " · ";
    }

    .read-more-btn {
        display: inline-block;
        background: #007bff;
        color: #fff;
        padding: 7px 18px;
        border-radius: 4px;
        text-decoration: none;
        font-size: 0.85rem;
        align-self: flex-start;
        transition: background 0.2s;
    }

    .read-more-btn:hover {
        background: #0056b3;
        color: #fff;
        text-decoration: none;
    }

    /* Pagination */
    .pagination-wrapper {
        display: flex;
        justify-content: center;
        padding: 24px 0 10px;
        gap: 6px;
        flex-wrap: wrap;
    }

    .pagination-wrapper button {
        padding: 7px 14px;
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
        color: #333;
        transition: all 0.2s;
    }

    .pagination-wrapper button:hover,
    .pagination-wrapper button.active {
        background: #007bff;
        color: #fff;
        border-color: #007bff;
    }

    /* Article Search */
    .search-container {
        display: flex;
        align-items: center;
        position: relative;
        z-index: 10002;
    }

    .search-box {
        flex: 1;
        padding: 9px 14px;
        font-size: 0.92rem;
        border: 1px solid #ccc;
        border-radius: 4px 0 0 4px;
        outline: none;
    }

    .search-button {
        padding: 9px 16px;
        border: 1px solid #ccc;
        border-left: none;
        background-color: #007bff;
        color: white;
        border-radius: 0 4px 4px 0;
        cursor: pointer;
    }

    .search-button i {
        font-size: 14px;
    }

    .search-results {
        position: absolute;
        top: 100%;
        left: 0;
        background: #fff;
        border: 1px solid #ccc;
        width: 100%;
        max-height: 400px;
        overflow-y: auto;
        display: none;
        z-index: 1000;
        padding: 8px;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .search-result-item {
        display: flex;
        align-items: center;
        padding: 6px;
        cursor: pointer;
    }

    .search-result-item:hover {
        background: #f0f0f0;
    }

    .search-result-item img {
        width: 50px;
        height: 50px;
        object-fit: cover;
        margin-right: 10px;
        border-radius: 4px;
    }

    .search-result-item .info {
        flex: 1;
    }

    .search-result-item .title {
        font-weight: bold;
        font-size: 14px;
    }

    .search-result-item .desc {
        font-size: 12px;
        color: #555;
    }

    .search-results .show-all {
        text-align: center;
        padding: 8px;
        font-weight: bold;
        border-top: 1px solid #ddd;
    }

    .search-results .show-all a {
        text-decoration: none;
        color: #007bff;
    }
</style>

<body>

    <header th:replace="nncminhchau :: header"></header>

	<div th:replace="nncminhchau :: videoSocialLinks"></div>

    <!-- Blog Page Starts Here -->
    <div class="about-page">
        <div class="container">

            <!-- Page heading -->
            <div class="section-heading" style="margin-top: 30px;">
                <div class="line-dec"></div>
                <h1></h1>
            </div>

            <!-- Article Search -->
            <div style="position: relative; margin-bottom: 18px;">
                <form th:action="@{/marine.html}" method="get" class="search-container" onsubmit="return true;" style="margin-bottom:0;">
                    <input type="text" id="searchBox" name="searchTerm" class="search-box"
                           placeholder="Tìm kiếm bài viết..."
                           th:value="${searchTerm != null ? searchTerm : ''}"
                           autocomplete="off">
                    <button type="submit" class="search-button">
                        <i class="fa fa-search"></i>
                    </button>
                </form>
                <div id="searchResults" class="search-results"></div>
            </div>

            <!-- Top pagination -->
            <div class="pagination-wrapper" th:if="${currentPage != null and totalPages > 1}">
                <form method="get" th:action="@{/marine.html}" style="display:contents;">
                    <input type="hidden" name="searchTerm" th:if="${searchTerm != null}" th:value="${searchTerm}" />
                    <button type="submit" name="page" th:value="${currentPage - 1}"
                            th:if="${currentPage > 1}">&laquo;</button>
                    <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
                        <button type="submit" name="page" th:value="${i}"
                                th:classappend="${i == currentPage} ? 'active' : ''"
                                th:text="${i}">1</button>
                    </th:block>
                    <button type="submit" name="page" th:value="${currentPage + 1}"
                            th:if="${currentPage < totalPages}">&raquo;</button>
                </form>
            </div>

            <!-- Blog grid -->
            <div class="blog-grid">
                <div class="blog-card" th:each="article : ${articles}">
                    <a th:href="'/' + ${midpath} + '/' + ${article.articleLink}">
                        <img class="blog-thumbnail"
                             th:src="${article.articleThumnailURLWithHost2}"
                             th:alt="${article.articleTitle}"
                             onerror="this.src='/img/placeholder.png'">
                    </a>
                    <div class="blog-content">
                        <h2 class="blog-title">
                            <a th:href="'/' + ${midpath} + '/' + ${article.articleLink}"
                               th:text="${article.articleTitle}">Tiêu đề bài viết</a>
                        </h2>
                        <div class="blog-meta">
                            <span th:text="${article.username}">Tác giả</span>
                            <span th:text="${#temporals.format(article.articleTime, 'dd-MM-yyyy')}">01-01-2025</span>
                        </div>
                        <p class="blog-description" th:text="${article.articleDescription}">
                            Mô tả ngắn bài viết...
                        </p>
                        <a th:href="'/' + ${midpath} + '/' + ${article.articleLink}"
                           class="read-more-btn">Đọc thêm</a>
                    </div>
                </div>

                <!-- Empty state -->
                <div th:if="${#lists.isEmpty(articles)}"
                     style="grid-column: 1/-1; text-align: center; padding: 60px 0; color: #999;">
                    <p style="font-size: 1.1rem;">Không có bài viết nào.</p>
                </div>
            </div>

            <!-- Bottom pagination -->
            <div class="pagination-wrapper" th:if="${currentPage != null and totalPages > 1}">
                <form method="get" th:action="@{/marine.html}" style="display:contents;">
                    <input type="hidden" name="searchTerm" th:if="${searchTerm != null}" th:value="${searchTerm}" />
                    <button type="submit" name="page" th:value="${currentPage - 1}"
                            th:if="${currentPage > 1}">&laquo;</button>
                    <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
                        <button type="submit" name="page" th:value="${i}"
                                th:classappend="${i == currentPage} ? 'active' : ''"
                                th:text="${i}">1</button>
                    </th:block>
                    <button type="submit" name="page" th:value="${currentPage + 1}"
                            th:if="${currentPage < totalPages}">&raquo;</button>
                </form>
            </div>

        </div>
    </div>
    <!-- Blog Page Ends Here -->

    <footer th:replace="nncminhchau :: footer"></footer>

    <div th:replace="nncminhchau :: scripts"></div>
    <script th:src="'/' + ${domain} + '/js/search.js'"></script>

</body>
</html>
