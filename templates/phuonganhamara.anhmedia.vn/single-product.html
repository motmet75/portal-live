<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{phuonganhamara.anhmedia.vn :: head(${product != null ? product.productName + ' — AMARA Academy' : 'Chi tiết khóa học — AMARA Academy'}, ${product != null ? product.productShortDes : 'Khóa học của AMARA Academy.'})}"></head><body>
<nav th:replace="~{phuonganhamara.anhmedia.vn :: nav('products')}"></nav>
<main class="section product-detail"><div class="container"><p class="breadcrumb"><a href="/home">Trang chủ</a> / <a href="/products.html">Khóa học</a> / <span th:text="${product.productName}">Tên khóa học</span></p><div class="detail-grid"><div class="detail-image"><img th:src="${product.productImageDesUrl}" th:alt="${product.productName}"></div><div><span class="eyebrow" th:text="${product.productCatalog}">Khóa học AMARA</span><h1 th:text="${product.productName}">Tên khóa học</h1><p class="detail-price" th:text="${product.formatedPriceAfterDiscount} + ' ₫'">0 ₫</p><p class="lead" th:text="${product.productShortDes}">Mô tả khóa học</p><div class="long-description" th:utext="${product.productLongDes}"></div><button class="btn btn-gold add-cart" type="button" th:attr="data-product-code=${product.productCode},data-product-name=${product.productName},data-product-image=${product.productImageDesUrl},data-product-price=${product.productPriceAmount}">Đăng ký khóa học</button><a class="btn btn-ghost" href="/products.html">← Xem khóa học khác</a></div></div></div></main>
<footer th:replace="~{phuonganhamara.anhmedia.vn :: footer}"></footer></body></html>
