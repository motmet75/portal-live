<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{milktea :: head('Thực đơn — Đại Lộ Coffee', 'Thực đơn cà phê và thức uống tại Đại Lộ Coffee Bình Phú.')}"></head>
<body>
<nav th:replace="~{milktea :: nav('products')}"></nav>
<header class="fh5co-cover dailo-page-hero" style="background-image:url('/milktea/images/gallery_3.jpeg')"><div class="overlay"></div><div class="container"><div class="display-t"><div class="display-tc text-center"><p class="hero-kicker">Pha mới mỗi ngày</p><h1>Thực đơn</h1></div></div></div></header>
<main class="fh5co-section menu-section"><div class="container"><div class="row"><div class="col-md-8 col-md-offset-2 text-center fh5co-heading"><h2>Chọn món bạn thích</h2><p>Cà phê Việt đậm đà, trà thanh mát và những món ngọt dễ uống.</p></div></div><div class="row">
  <article class="col-md-4 col-sm-6 menu-card" th:each="product : ${products}"><a th:href="'/product/' + ${product.path}" class="menu-card__image"><img th:src="${product.productImageDesUrl}" th:alt="${product.productName}"></a><div class="menu-card__body"><small th:text="${product.productCatalog}">Cà phê</small><h3><a th:href="'/product/' + ${product.path}" th:text="${product.productName}">Tên món</a></h3><p th:text="${product.productShortDes}">Mô tả</p><div class="menu-card__foot"><strong th:text="${product.formatedPriceAfterDiscount} + ' ₫'">29.000 ₫</strong><a th:href="'/product/' + ${product.path}">Chi tiết →</a></div></div></article>
  <div class="col-md-12 text-center empty-menu" th:if="${products == null or #lists.isEmpty(products)}"><h3>Menu đang được cập nhật</h3><p>Vui lòng ghé lại sớm hoặc đến trực tiếp tại 157–159 Bình Phú.</p></div>
</div></div></main>
<footer th:replace="~{milktea :: footer}"></footer>
</body></html>
